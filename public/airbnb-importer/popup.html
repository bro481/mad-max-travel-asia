<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;width:360px;color:#1f2933;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8}.head{background:#18242c;color:white;padding:18px}.head b{font-size:16px}.head p{margin:5px 0 0;color:#aeb9be;font-size:11px}.body{padding:16px}.card{background:white;border:1px solid #e2e6e8;border-radius:12px;padding:14px;margin-bottom:12px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #dce1e3;border-radius:8px;padding:11px;font-size:16px;letter-spacing:4px}button{border:0;border-radius:8px;background:#267a63;color:white;padding:11px 14px;width:100%;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.status{font-size:11px;line-height:1.6;color:#68737c;min-height:35px}.bar{height:6px;background:#e9edef;border-radius:5px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:#267a63;transition:.2s}.note{font-size:10px;color:#8b949b}ol{padding-left:18px;font-size:11px;color:#68737c;line-height:1.7}</style></head><body><div class="head"><b>MAD MAX Malaysia Stay 图片导入</b><p>读取当前 Airbnb 房源页，不读取账号密码</p></div><div class="body"><div class="card"><label for="code">后台一次性导入码</label><input id="code" inputmode="numeric" maxlength="8" placeholder="输入导入码"><ol><li>在后台图片管理生成导入码</li><li>打开 Airbnb 房源详情与全部照片</li><li>点击下方按钮开始导入</li></ol><button id="start">扫描并导入当前房源</button></div><div class="card"><div class="status" id="status">等待开始</div><div class="bar"><i id="progress"></i></div><div class="note">最多导入 50 张；第一张会成为房源封面。</div></div></div><script src="popup.js"></script></body></html>
